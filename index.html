<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测一测，你是《今天是太阳雨》里的谁</title>
<style>
  :root{
    --cream:#FFF7EA; --tomato:#E8503A; --sun:#FFC53D; --rain:#6FA8DC;
    --ink:#2B2B2B; --gray:#9A938A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:var(--cream); color:var(--ink); min-height:100vh;
  }
  .page{display:none; max-width:520px; margin:0 auto; padding:28px 20px 48px; min-height:100vh; flex-direction:column;}
  .page.active{display:flex;}

  /* 装饰 */
  .deco{position:fixed; pointer-events:none; z-index:0;}
  .deco.sun1{top:24px;right:20px;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFD97A, var(--sun)); box-shadow:0 0 0 10px rgba(255,197,61,.25);}
  .deco.drop1{bottom:80px;left:18px;width:16px;height:24px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:var(--rain); opacity:.6; transform:rotate(10deg);}
  .deco.drop2{top:45%;right:14px;width:12px;height:19px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:var(--rain); opacity:.45; transform:rotate(-8deg);}

  /* 落地页 */
  .badge{display:inline-block; background:var(--ink); color:#FFF7EA; font-size:13px;
    padding:6px 14px; border-radius:999px; align-self:center; letter-spacing:1px;}
  h1{font-size:34px; line-height:1.35; margin:22px 0 10px; text-align:center; font-weight:800;}
  h1 .red{color:var(--tomato);}
  .sub{font-size:15px; color:#6B655E; text-align:center; line-height:1.7;}
  .tags{margin:26px 0; display:flex; flex-direction:column; gap:12px;}
  .tag{background:#fff; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 4px 14px rgba(232,80,58,.08); border:2px solid #F3E7D3;}
  .tag .ck{flex:0 0 22px; height:22px; border-radius:6px; background:#58B368; position:relative;}
  .tag>div{flex:1; min-width:0;}
  .tag .ck::after{content:""; position:absolute; left:6px; top:3px; width:6px; height:11px;
    border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg);}
  .tag b{font-size:15px;} .tag span{font-size:13px; color:#8A837B; display:block; margin-top:2px;}
  .btn{appearance:none; border:none; cursor:pointer; width:100%; padding:18px 0; border-radius:999px;
    background:var(--ink); color:#FFF7EA; font-size:19px; font-weight:700; letter-spacing:2px;
    box-shadow:0 6px 0 #141414; transition:transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #141414;}
  .btn.red{background:var(--tomato); box-shadow:0 6px 0 #B93A28;}
  .btn.red:active{box-shadow:0 2px 0 #B93A28;}
  .foot{margin-top:auto; padding-top:28px; text-align:center; font-size:12px; color:var(--gray);}

  /* 答题页 */
  .progress-wrap{margin-bottom:8px;}
  .qnum{font-size:14px; color:var(--tomato); font-weight:700; margin-bottom:10px; text-align:center;}
  .bar{height:10px; border-radius:999px; background:#F0E4CE; overflow:hidden;}
  .bar i{display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--sun),var(--tomato)); width:0; transition:width .25s ease;}
  .qcard{background:#fff; border-radius:22px; border:2px solid #F3E7D3; padding:26px 20px;
    margin:20px 0 22px; box-shadow:0 6px 18px rgba(232,80,58,.08);}
  .qcard h2{font-size:19px; line-height:1.6; font-weight:700;}
  .opts{display:flex; flex-direction:column; gap:12px;}
  .opt{background:#fff; border:2px solid #F0E4CE; border-radius:16px; padding:15px 16px;
    font-size:15px; line-height:1.5; text-align:left; cursor:pointer; transition:all .15s;}
  .opt:active{transform:scale(.98);}
  .opt.picked{background:var(--tomato); border-color:var(--tomato); color:#fff; font-weight:700;}

  /* 结果页 */
  .r-label{text-align:center; font-size:14px; color:var(--gray); letter-spacing:2px; margin-top:10px;}
  .r-name{text-align:center; font-size:40px; font-weight:800; color:var(--tomato); margin:8px 0 4px;}
  .r-title{text-align:center; margin-bottom:20px;}
  .r-title span{display:inline-block; background:var(--sun); color:var(--ink); font-weight:700;
    font-size:15px; padding:6px 16px; border-radius:999px;}
  .r-card{background:#fff; border-radius:20px; border:2px solid #F3E7D3; padding:20px; margin-bottom:14px;}
  .r-card h3{font-size:14px; color:var(--rain); margin-bottom:10px; letter-spacing:1px;}
  .trait{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:15px;}
  .trait::before{content:""; flex:0 0 10px; height:10px; border-radius:50%; background:var(--sun);}
  .r-quote{font-size:18px; font-weight:700; text-align:center; color:var(--ink); padding:6px 0;}
  .r-cp{font-size:15px; text-align:center;}
  .r-cp b{color:var(--tomato);}
  .r-second{font-size:13px; color:var(--gray); text-align:center; margin:4px 0 20px;}
</style>
</head>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const pages = {home:$("page-home"), quiz:$("page-quiz"), result:$("page-result")};
  function show(name){ for(const k in pages) pages[k].classList.toggle("active", k===name); window.scrollTo(0,0); }

  // 落地页
  $("home-sub").textContent = DATA.quizSub;
  $("btn-start").textContent = DATA.startBtn;
  $("home-foot").textContent = DATA.footerNote;
  DATA.sellingPoints.forEach(([b,s])=>{
    const d = document.createElement("div");
    d.className = "tag";
    d.innerHTML = '<span class="ck"></span><div><b></b><span class="desc"></span></div>';
    d.querySelector("b").textContent = b;
    d.querySelector(".desc").textContent = s;
    $("home-tags").appendChild(d);
  });

  // 答题
  let idx = 0, scores = {};
  function startQuiz(){
    idx = 0; scores = {};
    DATA.roleOrder.forEach(r => scores[r] = 0);
    renderQ(); show("quiz");
  }
  function renderQ(){
    const [q, opts] = DATA.questions[idx];
    $("q-num").textContent = "第 " + (idx+1) + " / " + DATA.questions.length + " 题";
    $("q-bar").style.width = (idx / DATA.questions.length * 100) + "%";
    $("q-text").textContent = q;
    const box = $("q-opts"); box.innerHTML = "";
    opts.forEach(([text, role])=>{
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = text;
      b.onclick = ()=>{
        b.classList.add("picked");
        scores[role]++;
        setTimeout(()=>{
          idx++;
          if(idx < DATA.questions.length) renderQ();
          else finish();
        }, 180);
      };
      box.appendChild(b);
    });
  }

  // 结算：最高分，并列按角色池固定顺序取先
  function finish(){
    $("q-bar").style.width = "100%";
    const ranked = DATA.roleOrder.slice().sort((a,b)=>scores[b]-scores[a]);
    const main = ranked[0], second = ranked[1];
    const r = DATA.results[main];
    $("r-name").textContent = main;
    $("r-title").textContent = r.title;
    $("r-traits").innerHTML = "";
    r.traits.forEach(t=>{
      const d = document.createElement("div");
      d.className = "trait"; d.textContent = t;
      $("r-traits").appendChild(d);
    });
    $("r-quote").textContent = "“" + r.quote + "”";
    $("r-cp").innerHTML = "本命CP：<b></b>";
    $("r-cp").querySelector("b").textContent = r.cp;
    $("r-second").textContent = "你的次匹配角色是「" + second + "」· 差一点就是TA";
    show("result");
  }

  $("btn-start").onclick = startQuiz;
  $("btn-retry").onclick = startQuiz;
})();
</script>
</body>
</html>
